<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <rect width="180" height="180" rx="36" fill="#1e40af"/>
  <!-- Graduation cap -->
  <g transform="translate(90,82)" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cap top -->
    <polygon points="-48,-10 -8,-35 32,-10" fill="white" stroke="white"/>
    <polygon points="-48,-10 -8,-35 32,-10 32,0 -48,0" fill="white" stroke="white" stroke-width="3"/>
    <!-- Tassel -->
    <line x1="30" y1="-8" x2="48" y2="-28" stroke="white" stroke-width="4"/>
    <circle cx="50" cy="-30" r="5" fill="#fbbf24" stroke="#fbbf24"/>
  </g>
</svg>
